; LoRa Messenger Terminal — ESP32 front-end for an nRF52840 LoRa mesh node.
;
; One environment per bring-up stage (see PLAN.md section 5). Each stage is
; flashed and signed off on its own before the next one starts, so a fault is
; always attributable to exactly one layer.
;
;   pio run -e t1_display -t upload    Stage 1  TFT display
;   pio run -e t2_touch   -t upload    Stage 2  XPT2046 touch + calibration
;   pio run -e t3_touchui -t upload    Stage 3  touch as an LVGL input
;   pio run -e t4_uart    -t upload    Stage 4  UART link to the nRF52840
;   pio run -e t5_ui      -t upload    Stage 5  UI framework on mock data
;   pio test -e native                 Stage 6  protocol/logic tests on the PC
;   pio run -e app        -t upload    Stage 7  the integrated application

[platformio]
default_envs = app

; ─────────────────────────────────────────────────────────────────────────────
; Shared by every on-device environment.
;
; This is a plain section, not [env], and each device environment picks it up
; with `extends`. That is deliberate: [env] applies to EVERY environment
; including [env:native], which would inherit board=esp32dev and fail with
; "Unknown board ID" before a single host test could run.
; ─────────────────────────────────────────────────────────────────────────────
[esp32_base]
platform = espressif32@7.0.0          ; -> Arduino core 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; 921600 fails on this board/cable with "Unable to verify flash chip
; connection (No serial data received)" right after the baud switch. 460800
; was reliable for a while and then began failing the same way on this
; cable, so this is now the ROM loader's own default. It costs about seven
; seconds a flash and never fails; raise it again only if flashing gets
; annoying AND the cable is known good.
upload_speed = 115200

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=3

    ; ── TFT_eSPI configuration ───────────────────────────────────────────────
    ; Supplied here rather than by editing User_Setup.h, so the library stays
    ; pristine in .pio/ and the wiring lives in version control. These MUST be
    ; kept in sync with include/pins.h — that header static_asserts on it.
    ;
    ; 2.4" Uno-format shield: 8-bit parallel bus, not SPI.
    -DUSER_SETUP_LOADED=1
    -DTFT_PARALLEL_8_BIT=1

    ; ILI9342, NOT ILI9341 — confirmed empirically, because this panel does
    ; not implement the ID registers (see PLAN.md section 5).
    ;
    ; The two share an init sequence, a rotation table and a command set, and
    ; differ in exactly one thing that matters: native geometry. ILI9341 is
    ; 240x320, ILI9342 is 320x240 (TFT_Drivers/ILI9341_Defines.h).
    ;
    ; Getting this wrong does NOT produce a blank screen, which is what makes
    ; it expensive: the panel initialises, GRAM round-trips, throughput
    ; measures fine, and the only symptom is that drawing lands in the left
    ; 240 of 320 columns while the bottom 80 rows fall off the glass. The
    ; leftover pixels down the right-hand edge, which fillScreen() can no
    ; longer reach, are the tell.
    -DILI9342_DRIVER=1

    ; This panel is RGB-ordered; TFT_eSPI defaults these controllers to BGR.
    ; Without this, red and blue are exchanged - the SOS takeover renders
    ; blue, which on an emergency screen defeats the point of colouring it.
    ;
    ; The value is compared as a literal (TFT_RGB_ORDER == 1 means RGB in
    ; TFT_Drivers/ILI9341_Defines.h), so it must be 1, not a TFT_RGB symbol -
    ; that name does not exist and would quietly evaluate to 0, i.e. BGR.
    ;
    ; Stage 1b test 8 is the objective check: it writes a colour into GRAM and
    ; reads it back, so 0xF800 -> 0x001F is this fault stated in hex, with no
    ; eyeballing of a photograph involved.
    -DTFT_RGB_ORDER=1

    -DTFT_CS=26
    -DTFT_DC=25
    -DTFT_RST=15
    -DTFT_WR=27
    -DTFT_RD=4
    -DTFT_D0=13
    -DTFT_D1=14
    -DTFT_D2=21
    -DTFT_D3=22
    -DTFT_D4=23
    -DTFT_D5=18
    -DTFT_D6=19
    -DTFT_D7=5

    ; Fonts: GLCD (tiny), 2/4/6/7/8 (bitmap), GFXFF (free fonts), smooth (AA).
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    ; ── LVGL ─────────────────────────────────────────────────────────────────
    ; Makes LVGL resolve its config with a plain #include "lv_conf.h".
    ;
    ; -I include is NOT redundant. PlatformIO puts the project's include/ dir
    ; on the path for src/ but not for lib/ or for downloaded libraries, so
    ; without this LVGL finds lv_conf.h when compiling src/ and silently falls
    ; back to its built-in defaults everywhere else — producing one library
    ; built two different ways. It does not fail the build; static_asserts in
    ; lib/lvgl_port/lvgl_port.cpp are what actually catch it.
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^9.5.0

; ─────────────────────────────────────────────────────────────────────────────
; Stage 1a — identify the LCD controller. Bit-bangs the parallel bus directly
; and reads the ID registers; uses no display library, so it runs before the
; driver is known. Its answer decides the *_DRIVER flag above.
; ─────────────────────────────────────────────────────────────────────────────
[env:t1a_lcdid]
extends = esp32_base
build_src_filter = -<*> +<../test_apps/t1a_lcd_id.cpp>
lib_ignore = lvgl, lvgl_port, Touch, TouchCal, UI, LoraLink, MessageStore

; ─────────────────────────────────────────────────────────────────────────────
; Stage 1b — TFT display bring-up (run Stage 1a first)
; ─────────────────────────────────────────────────────────────────────────────
[env:t1_display]
extends = esp32_base
build_src_filter = -<*> +<../test_apps/t1_display.cpp>
lib_ignore = lvgl, lvgl_port, Touch, TouchCal, UI, LoraLink, MessageStore

; ─────────────────────────────────────────────────────────────────────────────
; Stage 1c — LVGL port bring-up: draw buffer, flush callback, tick, memory
; pool, fonts and theme, driven by LVGL's own animation timers. No input.
; ─────────────────────────────────────────────────────────────────────────────
[env:t1c_lvgl]
extends = esp32_base
build_src_filter = -<*> +<../test_apps/t1c_lvgl.cpp>
lib_ignore = UI, LoraLink, MessageStore

; ─────────────────────────────────────────────────────────────────────────────
; Stage 2 — resistive touch: raw readout, calibration, verification. Talks to
; TFT_eSPI directly so a touch fault cannot be confused with an LVGL one.
; ─────────────────────────────────────────────────────────────────────────────
[env:t2_touch]
extends = esp32_base
build_src_filter = -<*> +<../test_apps/t2_touch.cpp>
lib_ignore = lvgl, lvgl_port, UI, LoraLink, MessageStore

; ─────────────────────────────────────────────────────────────────────────────
; Stage 3 — touch as an LVGL input device: hit rate on minimum-size targets
; across the whole panel, and tap-versus-scroll discrimination.
; ─────────────────────────────────────────────────────────────────────────────
[env:t3_touchui]
extends = esp32_base
build_src_filter = -<*> +<../test_apps/t3_touchui.cpp>
lib_ignore = UI, LoraLink, MessageStore

; ─────────────────────────────────────────────────────────────────────────────
; Stage 4 — UART link to the nRF52840: loopback, then the real node.
; ─────────────────────────────────────────────────────────────────────────────
[env:t4_uart]
extends = esp32_base
build_src_filter = -<*> +<../test_apps/t4_uart.cpp>
lib_ignore = lvgl, lvgl_port, Touch, TouchCal, UI

; ─────────────────────────────────────────────────────────────────────────────
; Stage 5 — the whole UI, driven by a fake message generator. No radio.
; ─────────────────────────────────────────────────────────────────────────────
[env:t5_ui]
extends = esp32_base
build_src_filter = -<*> +<../test_apps/t5_ui.cpp>

; ─────────────────────────────────────────────────────────────────────────────
; Touch diagnostic suite — self-scoring battery over the raw panel and the
; calibrated mapping. Not a bring-up stage: run it after Stage 2/3 whenever
; touch feels wrong, and before trusting the integrated app on hardware.
; Every phase passes or fails on a number; a 6/6 verdict is the sign-off.
; ─────────────────────────────────────────────────────────────────────────────
[env:t6_touchdiag]
extends = esp32_base
build_src_filter = -<*> +<../test_apps/t6_touchdiag.cpp>
lib_ignore = lvgl, lvgl_port, UI, LoraLink, MessageStore

; ─────────────────────────────────────────────────────────────────────────────
; Touch alignment check — draws a crosshair, measures where the tap registers,
; and auto-recalibrates if the offset exceeds the limit. The quick "is my
; touch pointing where I press" tool, and the one to leave running after any
; calibration change. Recalibrates on drift automatically.
; ─────────────────────────────────────────────────────────────────────────────
[env:t7_touchcheck]
extends = esp32_base
build_src_filter = -<*> +<../test_apps/t7_touchcheck.cpp>
lib_ignore = lvgl, lvgl_port, UI, LoraLink, MessageStore

; ─────────────────────────────────────────────────────────────────────────────
; Integrated application, self-calibrating variant — a duplicate of src/main
; whose boot path proves the touch alignment with one centre tap and
; recalibrates on any measured offset before the UI is presented. Catches a
; stale/mis-calibrated panel at boot instead of presenting an unreachable UI.
; ─────────────────────────────────────────────────────────────────────────────
[env:t8_app_cal]
extends = esp32_base
build_src_filter = -<*> +<../test_apps/t8_app_cal.cpp>

; ─────────────────────────────────────────────────────────────────────────────
; Integrated application, RTOS variant — the same self-calibrating app but
; split into three FreeRTOS tasks (radio/ui/status) with a bounded event
; queue, a mutex on the shared link, static allocation, and a task-paced
; LVGL loop. UART is serviced at its own priority and idle CPU drops to
; near zero.
; ─────────────────────────────────────────────────────────────────────────────
[env:t9_app_rtos]
extends = esp32_base
build_src_filter = -<*> +<../test_apps/t9_app_rtos.cpp>

; ─────────────────────────────────────────────────────────────────────────────
; Stage 7 — the integrated application
; ─────────────────────────────────────────────────────────────────────────────
[env:app]
extends = esp32_base
build_src_filter = +<*>

; ─────────────────────────────────────────────────────────────────────────────
; Stage 6 — logic tests on the host. LoraLink and MessageStore are written
; free of Arduino calls precisely so they can run here in under a second.
; test_filter keeps `pio test` away from reference/nrf.cpp, which is Zephyr
; reference source for the radio node and is not built by PlatformIO at all.
;
; Note this env does NOT extend esp32_base — no board, no framework, no
; TFT_eSPI, no LVGL. That is the point: if a logic library ever picks up an
; Arduino dependency, this environment stops compiling and says so.
; ─────────────────────────────────────────────────────────────────────────────
[env:native]
platform = native
test_framework = unity
test_filter = test_logic_*
; -I include for the same reason the device envs need it: PlatformIO puts the
; project include/ dir on the path for src/ and test/, but NOT for lib/, and
; every one of these libraries includes app_config.h.
build_flags = -std=gnu++17 -DUNIT_TEST -Wall -I include
; The device-only libraries would drag in Arduino.h and TFT_eSPI.
lib_ignore = lvgl, TFT_eSPI, lvgl_port, Touch, TouchCal, UI
